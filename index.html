<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body{
        background-color: cornflowerblue;
    }
    
    #tennis{
        display: block;
        margin-left: auto;
        margin-right: auto;
        width: 50%;
        border-radius: 10px;
        border: 5px solid rgb(1, 62, 174);
    }

    h1{
        color: white;
        background-color: rgb(0, 128, 79);
        font-family: 'Gill Sans';
        width: 535px;
        padding: 3px;
        text-align: center;
        margin: 0 auto;
        border-radius: 8px;
        text-shadow: 2px 2px 4px rgb(24, 96, 230);
    }
    #rule, #equip, #tech{
        display: block;
        margin: auto;
        width: 50px;
        height: auto;
        background-color: rgb(138, 255, 154);
        box-shadow: 0px 3px 10px rgb(17, 85, 26);
        padding: 15px;
        border-radius: 10px;
        font-family: 'Gill Sans';
        color: rgb(0, 85, 57);
    }
    h4{
        color: rgb(0, 85, 57);
        background-color: rgb(167, 255, 221);
        font-family: 'Gill Sans';
        width: 140px;
        padding: 3px;
        text-align: center;
        margin: 0 auto;
        border-radius: 8px;
        text-shadow: 2px 2px 4px rgb(0, 47, 31);
    }
    ul{
        font-size: large;
    }
</style>
<body>
    <div class="container">
        <div class="h1">
            <br><br>
            <h1>🎾Guide to Beginner Tennis🎾</h1>
        </div>

        <br>

            <img src="https://i0.wp.com/coverstory.ph/wp-content/uploads/2026/07/Alex-Eala.png?fit=1700%2C900&ssl=1" id="tennis" alt="tennis">

        <br><br>

        <div class="row gap-5">
            <div class="col" id="rule">
                <h4>Rules🗒️</h4>
                <br>
                <ul>
                    <li>Hit ball over net</li>
                    <li>Ball on line=in</li>
                    <li>4 points=win</li>
                </ul>
            </div>

            <div class="col" id="equip">
                <h4>Equipment👟</h4>
                <br>
                <ul>
                    <li>Tennis racket & ball</li>
                    <li>Proper attire</li>
                    <li>Court with net</li>
                </ul>
            </div>

            <div class="col" id="tech">
                <h4>Technique🎾</h4>
                <br>
                <ul>
                    <li>Proper stroke</li>
                    <li>Grip</li>
                    <li>Contact point</li>
                </ul>
            </div>
        </div>
    </div>
    <br><br>
</body>
</html>
